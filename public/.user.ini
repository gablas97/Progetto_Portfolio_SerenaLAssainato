; Dimensione massima file upload (video)
upload_max_filesize = 50M

; Dimensione massima POST (deve essere >= upload_max_filesize)
post_max_size = 60M

; Tempo massimo esecuzione script (per upload lenti)
max_execution_time = 300

; Memoria massima per script PHP
memory_limit = 256M

; Numero massimo di file caricabili contemporaneamente
max_file_uploads = 20